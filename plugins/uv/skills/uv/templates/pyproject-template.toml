# Starter pyproject.toml template for uv + LSP
# Remove sections you don't need. See uv docs for more options.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-project"
version = "0.1.0"
description = "Project description here"
requires-python = ">=3.10"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["python", "project"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Main dependencies
dependencies = [
    "requests>=2.31.0",
]

# Optional dependency groups
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]

# Console scripts (CLI commands)
[project.scripts]
# my-cli = "my_project.cli:main"

# URLs for documentation, bugtracker, etc.
[project.urls]
Homepage = "https://github.com/user/my-project"
Documentation = "https://docs.example.com"
Repository = "https://github.com/user/my-project"
Issues = "https://github.com/user/my-project/issues"

# uv-specific configuration
[tool.uv]
# Uncomment to set dev dependencies (alternative to [project.optional-dependencies])
# dev-dependencies = ["pytest>=7.0.0"]

# Optional: specify alternate sources for packages
# [tool.uv.sources]
# my-local-package = {path = "../my-local-package"}

# Monorepo workspace configuration (if using workspace)
# [tool.uv.workspace]
# members = ["packages/*"]

# Ruff configuration (linting & formatting)
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "S",      # flake8-bandit
    "C",      # flake8-comprehensions
]
ignore = [
    "E501",   # Line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["my_project"]

# Pyright configuration (type checking)
[tool.pyright]
typeCheckingMode = "standard"  # or "basic", "strict"
pythonVersion = "3.10"
include = ["src"]
exclude = ["tests", "build", "dist", ".venv"]
reportMissingImports = true
reportUntypedFunctionDefs = false

# Pytest configuration (testing)
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --cov=my_project --cov-report=term-missing"

# Coverage configuration
[tool.coverage.run]
source = ["my_project"]
omit = [
    "*/tests/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
